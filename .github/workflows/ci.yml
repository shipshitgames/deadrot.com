name: CI

# Fast trunk gate. Trunk-based workflow: `master` is the only long-lived branch,
# every change lands via a short-lived PR into master. These two jobs are the
# REQUIRED status checks on master PRs (kept fast on purpose); the heavy E2E suite
# runs at release time (see release.yml), not on every PR.
# The two jobs run in PARALLEL (separate runners) and are kept as distinct jobs
# because `master` branch protection requires these exact job names:
#   - "Lint, format, typecheck, assets"
#   - "Unit tests"
# Renaming or merging them into a single job would break those required checks.

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same PR (or branch, on push) so rapid pushes /
# force-updates don't leave stale runs burning minutes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # All JS actions on Node 24 ahead of the 2026-06-16 default switch
  # (covers third-party actions still declaring node20, e.g. setup-bun).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    name: Lint, format, typecheck, assets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun install cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `biome check` = formatter + linter + import-order assist (organizeImports).
      # Running it here enforces import ordering repo-wide on every PR. Curated
      # barrels (packages/*/src/index.ts) are exempted via an override in
      # biome.json — see docs/biome-import-ordering.md.
      - name: Check format, lint & import order
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Check generated assets
        run: bun run --cwd packages/assets assets:check

      - name: Build all apps
        run: bun run build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun install cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run package unit tests
        run: bun run test:unit

      - name: Run cross-game catalog unit tests
        run: bun run test:e2e:unit

  # Coverage gate for the agreed enforced scope (issue #6): the pure-logic
  # runtime packages @deadrot/catalog, @deadrot/game-kit, and
  # @shipshitgames/warline must stay at >=80% line+function coverage. This job
  # is intentionally NOT one of the two required-status jobs above; promoting it
  # to required branch protection is tracked separately (#385). It still goes
  # red (failing the run) when coverage drops below the baseline.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun install cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run coverage gate (agreed scope)
        run: bun run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage gate (agreed scope)"
            echo ""
            echo "Enforced \`>=80%\` line + function coverage on the pure-logic runtime packages:"
            echo "- \`@deadrot/catalog\`"
            echo "- \`@deadrot/game-kit\`"
            echo "- \`@shipshitgames/warline\`"
            echo ""
            echo "Per-package \`lcov.info\` + text reports are attached as the \`coverage-reports\` artifact. See \`docs/coverage.md\` for the policy and how to run it locally."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          # Just the final lcov reports — bun also drops transient
          # .lcov.info.<hash>.tmp files in coverage/ that would clutter the artifact.
          path: |
            packages/catalog/coverage/lcov.info
            packages/game-kit/coverage/lcov.info
            packages/warline/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
