# deadrot-api, co-located on the us-west-1 EC2 host that serves api.deadrot.com
# (52.8.153.188 / i-00e74422e719396c3) ALONGSIDE api.shipshit.dev. This is a
# SEPARATE compose project (name: api-deadrot-com) and container so it never
# touches the api.shipshit.dev service. Image is built+pushed from the deadrot.com
# repo to ghcr; the host pulls it. DATABASE_URL (deadrot-api RDS) comes from
# deadrot's OWN env file, rendered by deploy-deadrot.sh from the
# /shipshit/production/deadrot SSM subtree (us-east-1) — NOT the host's shared
# ../.env.production (whose DATABASE_URL is the api-shipshit-dev RDS). Everything
# else is deadrot-specific and set here.
name: api-deadrot-com

services:
  api-deadrot-com:
    image: ghcr.io/shipshitgames/deadrot.com/api:${IMAGE_TAG:-latest}
    container_name: deadrot-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      # Caddy proxies api.deadrot.com -> deadrot-api:3004 by container name over
      # this shared host network, so container_name above is load-bearing.
      - shipshit
    ports:
      # Localhost publish kept for the deploy health check (curls localhost:3004).
      # Caddy reaches this container over the `shipshit` network, not this port.
      - "127.0.0.1:3004:3004"
    env_file:
      # Deadrot's OWN env, rendered by deploy-deadrot.sh from the
      # /shipshit/production/deadrot SSM subtree. Its load-bearing contribution is
      # DATABASE_URL -> deadrot-api RDS (+ DATABASE_SSL_MODE). The operational keys
      # the subtree also carries (NODE_ENV/HOST/PORT/SERVICE_NAME/ALLOWED_ORIGINS/
      # CDN_ORIGIN) are intentionally PINNED in `environment:` below — which wins
      # over env_file — so editing those in SSM has no effect here.
      # NOT ../.env.production (that is api.shipshit.dev's shared env).
      - .env.deadrot.production
    environment:
      # Pinned operational config; overrides any same-named env_file key above.
      # HOST/PORT MUST stay 0.0.0.0/3004 to match the published port + healthcheck.
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3004
      - SERVICE_NAME=deadrot-api
      - ALLOWED_ORIGINS=https://deadrot.com,https://www.deadrot.com
      - CDN_ORIGIN=https://cdn.deadrot.com
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3004/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

# Shared external bridge created on the host (carries api.shipshit.dev + Caddy).
networks:
  shipshit:
    external: true
