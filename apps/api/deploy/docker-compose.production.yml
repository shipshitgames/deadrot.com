# Production compose for the Deadrot API, run on the EC2 host from ~/cloud/docker.
# The image is built in CI and shipped as a tarball (docker save | scp | docker
# load) — no registry. Env is rendered from AWS SSM by render-ssm-env.sh into
# ./.env (instance-role auth). See README.md for the full contract.
name: deadrot-api

services:
  api:
    image: deadrot-api:release
    container_name: deadrot-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # The API listens on 3004; the host reverse proxy / ALB fronts it for
      # api.deadrot.com. Bound to localhost so only the proxy reaches it.
      - "127.0.0.1:3004:3004"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:3004/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
